version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/services/scrivener"
    schedule:
      interval: "weekly"
    groups:
      scrivener-dependencies:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/services/sophia_pylon"
    schedule:
      interval: "weekly"
    groups:
      pylon-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend/sophia-dashboard"
    schedule:
      interval: "weekly"
    groups:
      dashboard-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
