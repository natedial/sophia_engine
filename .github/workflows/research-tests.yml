name: Research tests

# Runs the research-path packages: Episto, Oikonomia, Arithmos and the
# outside research agent client. Legacy assistant packages and Scrivener
# are not covered here.

on:
  push:
    branches: ["main"]
  # No branch filter, so stacked pull requests get checks too.
  pull_request:

permissions:
  contents: read

concurrency:
  group: research-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.10
      - name: Episto research path
        working-directory: core/sophia_episto
        run: ruff check src/sophia_episto/research tests/test_research
      - name: Oikonomia
        working-directory: services/sophia_oikonomia
        run: ruff check .
      - name: Arithmos
        working-directory: services/sophia_arithmos
        run: ruff check .
      - name: Outside research agent
        working-directory: clients/outside_research_agent
        run: ruff check .

  episto:
    name: episto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      # Episto's default runner needs Oikonomia and Arithmos importable;
      # without them the lease and Granger tests are skipped.
      - run: >
          pip install
          -e "core/sophia_episto[dev]"
          -e "services/sophia_oikonomia[dev]"
          -e "services/sophia_arithmos[dev]"
      - working-directory: core/sophia_episto
        run: python -m pytest -q

  oikonomia:
    name: oikonomia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: >
          pip install
          -e "services/sophia_oikonomia[dev]"
          -e "services/sophia_arithmos[dev]"
      - working-directory: services/sophia_oikonomia
        run: python -m pytest -q

  arithmos:
    name: arithmos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install -e "services/sophia_arithmos[dev]"
      - working-directory: services/sophia_arithmos
        run: python -m pytest -q

  client:
    name: outside-research-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: >
          pip install
          -e "core/sophia_episto[dev]"
          -e "services/sophia_oikonomia[dev]"
          -e "services/sophia_arithmos[dev]"
          -e "clients/outside_research_agent[dev]"
      - working-directory: clients/outside_research_agent
        run: python -m pytest -q
