[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outside-research-agent"
version = "0.1.0"
description = "Scripted outside agent that coordinates Analyst claims and Sophia research cases"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
outside-research-agent = "outside_research_agent.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
