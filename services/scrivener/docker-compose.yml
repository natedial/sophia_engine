services:
  api:
    build: .
    image: scrivener:latest
    pull_policy: build
    command: ["scrivener", "serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Reuse the image built by `api` — do not also declare `build:` here.
  # Parallel builds of the same tag race and fail with "image already exists".
  scheduler:
    image: scrivener:latest
    pull_policy: never
    depends_on:
      - api
    command: ["scrivener", "scheduler"]
    env_file: .env
    restart: unless-stopped
