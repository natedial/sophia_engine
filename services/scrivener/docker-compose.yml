services:
  api:
    build: .
    image: scrivener:latest
    command: ["scrivener", "serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  scheduler:
    build: .
    image: scrivener:latest
    command: ["scrivener", "scheduler"]
    env_file: .env
    restart: unless-stopped
